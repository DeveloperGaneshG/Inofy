server {
    listen 80;
    server_name infovy.visionextech.in;

    # Path to the built React app (dist folder)
    root /var/www/invofy/dist;
    index index.html;

    # ── SPA fallback ────────────────────────────────────────────────────────────
    # If no file matches the requested path, serve index.html so React Router
    # can handle client-side routing (required for direct URL access and refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets: cache aggressively (Vite adds content hashes to names) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html: never cache so updates deploy immediately ───────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Optional: HTTPS redirect (if you have SSL set up via certbot) ───────────
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/infovy.visionextech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/infovy.visionextech.in/privkey.pem;
}
